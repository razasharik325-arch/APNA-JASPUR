<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff6b35"><title>Apna Jaspur food delivery</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7ed;color:#222}header{background:linear-gradient(135deg,#ff6b35,#ffb703);color:#fff;padding:20px;text-align:center;position:sticky;top:0;z-index:4}h1{margin:0;font-size:24px}header p{margin:5px 0}.tabs{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;position:sticky;top:83px;z-index:3}.tabs button{border:0;border-radius:22px;padding:9px 13px;white-space:nowrap}.tabs .on{background:#ff6b35;color:#fff}main{max-width:850px;margin:auto;padding:10px}.shop{background:#fff;border-radius:16px;margin:12px 0;padding:15px;box-shadow:0 3px 14px #0001}.shop h2{margin:0;color:#e65100}.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #eee;padding:10px 0}.price{font-weight:bold}.add,.save,.login{background:#ff6b35;color:#fff;border:0;border-radius:18px;padding:8px 13px}.cart{position:fixed;right:14px;bottom:14px;background:#111;color:#fff;border:0;border-radius:30px;padding:14px 18px;z-index:6}#modal,#admin{display:none;position:fixed;inset:0;background:#0008;z-index:10}.box{background:#fff;max-width:620px;margin:5vh auto;padding:20px;border-radius:18px;max-height:90vh;overflow:auto}.box input,.box textarea,.box select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:9px}.close{float:right;border:0;border-radius:50%;padding:7px}.notice{background:#fff3cd;padding:10px;border-radius:10px;margin:10px 0;font-size:13px}</style></head><body><header><h1>🍴 Apna Jaspur Colorful Home</h1><p>Jaspur का अपना Food Menu & Delivery</p></header><nav class="tabs" id="tabs"></nav><main id="app"></main><button class="cart" onclick="openCart()">🛒 Cart <span id="count">0</span></button><button style="position:fixed;left:14px;b  {"name": "Til Ke Laddu", "price": "₹16 / piece"}]}, {"name": "Afzalgarh Ki Mashhur Makhni Lassi", "cat": "Drinks", "items": [{"name": "Lassi (Mawa + Malai + Badam + Kishmish)", "price": "₹70"}]}, {"name": "Orhan Shawarma House", "cat": "Shawarma", "items": [{"name": "Buff Nalli", "price": "₹140"}, {"name": "Buff Turkey", "price": "₹110"}, {"name": "Buff Lebanese", "price": "₹90"}, {"name": "Chicken Lebanese", "price": "₹75"}, {"name": "Chicken Turkish", "price": "₹90"}, {"name": "Musa Khan", "price": "₹170"}]}];let cart=[];function renderTabs(){tabs.innerHTML=['All',...new Set(shops.map(s=>s.cat))].map((c,i)=>`<button class="${i?'':'on'}" onclick="filterCat('${c}',this)">${c==='All'?'सभी':c}</button>`).join('')}function render(list=shops){app.innerHTML=list.map(s=>`<section class="shop"><h2>${s.name}</h2>${s.name==='Al-Taj Restaurant'?'<small>In front of Muslim Fund, Afzalgarh Road, Jaspur</small>':''}${s.items.map(x=>`<div class="item"><span>${x.name}<br><span class="price">${x.price}</span></span><button class="add" onclick='add("${s.name.replaceAll('"','&quot;')}","${x.name.replaceAll('"','&quot;')}","${x.price}")'>+ Add</button></div>`).join('')}</section>`).join('')}function filterCat(c,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(c==='All'?shops:shops.filter(s=>s.cat===c))}function add(shop,item,price){cart.push({shop,item,price});count.textContent=cart.length}function openCart(){modal.style.display='block';cartItems.innerHTML=cart.length?cart.map(x=>`<p>${x.shop} — ${x.item} — ${x.price}</p>`).join(''):'<p>Cart खाली है।</p>'}function closeCart(){modal.style.display='none'}function sendOrder(){if(!cart.length)return alert('पहले item add करें');let t='Apna Jaspur Colorful Home Order
